name: CI

on:
  push: { branches: [main] }
  pull_request:

jobs:
  # The fast lane. No services, no containers — PGlite is real Postgres in
  # process, so this still exercises every constraint, trigger and RLS policy.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  # The strict lane. Same suite, real server, and the only place the pgvector
  # DDL actually executes.
  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: chittu
          POSTGRES_PASSWORD: chittu
          POSTGRES_DB: chittu_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U chittu -d chittu_test"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://chittu:chittu@localhost:5432/chittu_test
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  # The client's size budget, as a gate rather than a paragraph. The device
  # floor is a ₹8,000 Android on 3G, and a budget that only lives in a document
  # gets exceeded 20 KB at a time until the phone is in a child's hand.
  #
  # Transfer size only. LCP on the target hardware is still unmeasured — GAP-08
  # is open and the fix is to buy the phone, not to add a job here.
  web-budget:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @chittu/web build
      - run: pnpm --filter @chittu/web size

  # The prototype is still the reference implementation of the pipeline, so its
  # harness keeps running alongside the backend's.
  prototype:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: 11 }
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:prototype

  # The grader IS the G2 gate (CLAUDE.md), so a change to it must still print 30/30.
  grader:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python3 llm-kit/test_eval_guard.py
