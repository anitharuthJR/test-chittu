# Postgres 16 + pgvector, for running the suite.
#
# REQUIRED. `pnpm test` starts this service itself and runs against it. Until
# 2026-08-25 it was optional — without DATABASE_URL the suite fell back to
# PGlite, real Postgres compiled to WASM and in-process — and this service
# existed only to close the three gaps that fallback could not: pgvector,
# genuine concurrency, and a server binary rather than an in-process one. It
# turned out to be faster as well as stricter, so the fallback went.
#
#   pnpm test                     (starts this; OrbStack is a drop-in for Docker)
#   pnpm db:up                    (or start it by hand)
#
# The `dev` PROFILE is a second, separate thing: the API in its own container
# against its own Postgres, which is the smallest honest rehearsal of §14's
# topology available without AWS.
#
#   pnpm stack:up / pnpm stack:down
#
# Kept behind a profile so `docker compose up -d` still means "the test
# database, nothing else", which is what `pnpm test` starts. `scripts/dev.sh`
# brings up postgres-dev from this profile — the database only, not the api or
# migrate services — and runs `pnpm db:migrate` against it from the host.
#
# ONE PROJECT FOR THE WHOLE REPOSITORY, not one per worktree.
#
# Compose derives its project name from the DIRECTORY unless told otherwise, and
# this repo is used through 2-3 parallel worktrees (CLAUDE.md). So each worktree
# declared its own `<dir>-postgres-1` and each tried to publish the same host
# port: six containers for one logical database, one holding :55432 and five
# dead, with `pnpm test` and `pnpm verify` failing in five checkouts out of six
# on a Docker driver error that reads as "Docker is broken" rather than "another
# worktree already has this". A worse variant was live too — a `postgres-dev`
# container UP with no published ports at all, a database nothing could reach.
#
# Pinning the name means every worktree targets the SAME project, so `up -d
# --wait` finds the container already healthy and no-ops.
#
# Test isolation was never the port's job. `createTestDb` builds a throwaway
# `t_<hex>` schema per FIXTURE — that is what already lets parallel test files
# share one server, and it generalises to parallel worktrees unchanged.
#
# TWO CONSEQUENCES, both deliberate:
#   - `pnpm db:down` (`down -v`) now destroys the database for EVERY WORKTREE,
#     including any mid-run. It was per-directory before; it is repository-wide
#     now. Still available, still destructive, no longer local.
#   - A branch that EDITS this file makes `up` recreate the container for
#     everyone. That is correct — the config genuinely changed — and rare.
name: chittu

services:
  postgres:
    # pgvector's own image, so CREATE EXTENSION vector is available. Pinned to
    # 16 because that is the version chittu-architecture.md §2.2 commits to.
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chittu
      POSTGRES_PASSWORD: chittu
      POSTGRES_DB: chittu_test
    ports:
      - '55432:5432'      # not 5432, so it cannot collide with a local install
    tmpfs:
      # A test database has nothing worth surviving a restart, and running on
      # tmpfs makes the suite noticeably faster.
      - /var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chittu -d chittu_test']
      interval: 2s
      timeout: 3s
      retries: 20
      # start_period, because a COLD volume fails this check for a reason that
      # is not failure. pgvector's entrypoint runs initdb, starts a TEMPORARY
      # server to apply it, then shuts that server down to start the real one —
      # and `pg_isready` passes against the temporary one and then fails through
      # the shutdown. At interval 2s x 20 retries with no start_period, those
      # probes burn the whole retry budget and compose declares the container
      # unhealthy, so `depends_on: service_healthy` gives up on a database that
      # was seconds from being fine. Failures inside this window do not count;
      # the container still goes healthy the moment a probe succeeds, so a
      # generous value costs a working start nothing.
      start_period: 60s

  # --------------------------------------------------------------- dev stack ---
  # Its own database, on its own port and a real volume: this one is meant to
  # survive a restart, which is exactly the opposite of the tmpfs test instance
  # above and the reason it is not the same service.
  postgres-dev:
    profiles: ['dev']
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: chittu
      POSTGRES_PASSWORD: chittu
      POSTGRES_DB: chittu
    ports:
      - '55433:5432'
    volumes:
      - chittu-dev-data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U chittu -d chittu']
      interval: 2s
      timeout: 3s
      retries: 20
      # start_period, because a COLD volume fails this check for a reason that
      # is not failure. pgvector's entrypoint runs initdb, starts a TEMPORARY
      # server to apply it, then shuts that server down to start the real one —
      # and `pg_isready` passes against the temporary one and then fails through
      # the shutdown. At interval 2s x 20 retries with no start_period, those
      # probes burn the whole retry budget and compose declares the container
      # unhealthy, so `depends_on: service_healthy` gives up on a database that
      # was seconds from being fine. Failures inside this window do not count;
      # the container still goes healthy the moment a probe succeeds, so a
      # generous value costs a working start nothing.
      start_period: 60s

  # Runs to completion, then exits. The API waits for it rather than migrating
  # itself: bootstrapDb() deliberately does NOT migrate the Postgres path, because
  # a service that migrates on boot runs N times concurrently the moment it scales
  # past one task. This is the shape a deployment uses — a migration task before
  # the service — rehearsed locally.
  migrate:
    profiles: ['dev']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      NODE_ENV: development
      DATABASE_URL: postgres://chittu:chittu@postgres-dev:5432/chittu
    # Just the script: the distroless runtime's ENTRYPOINT is already node, and
    # there is no tsx and no src/ in the image any more.
    command: ['dist/migrate.js']
    depends_on:
      postgres-dev:
        condition: service_healthy
    restart: 'no'

  api:
    profiles: ['dev']
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    environment:
      # The image defaults to production — deliberately, so an unconfigured
      # deployment refuses to start rather than serving children through the
      # stub router. Local rehearsal opts OUT of that here, in the open.
      NODE_ENV: development
      DATABASE_URL: postgres://chittu:chittu@postgres-dev:5432/chittu
      # Passed through if the shell has one; absent means the stub router, and
      # the API says so on the first line of its output.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - '8080:8080'
    depends_on:
      postgres-dev:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  chittu-dev-data:
