<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Chittu</title>
  <meta name="description" content="A safety-first companion for children, by Tulifo." />
  <meta name="theme-color" content="#EAF6FF" />
  <link rel="manifest" href="/manifest.webmanifest" />

  <!--
    No analytics tag, no tag manager, no third-party script of any kind. That is
    architecture §2.1 and it is a hard constraint: platform rules for children's
    apps plus the DPDP profiling ban. If you are about to add one, the answer is
    no — take it to the Council.

    Fonts are self-hosted and must stay that way. Hotlinking
    fonts.googleapis.com would send every child's IP address to a third party on
    every page load — precisely the thing the line above exists to prevent. The
    WOFF2 files live in src/fonts/ with their OFL licences and are regenerated by
    scripts/build-fonts.sh. If you are about to add a font <link>, the answer is
    the same as for analytics: no.
  -->
</head>
<body>
  <div id="app"></div>
  <noscript>
    Chittu needs JavaScript to work. Sorry about that.
  </noscript>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
